name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with APK'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore Keystore and Environment Config
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              echo "Restoring debug.keystore from debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating new debug.keystore..."
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Organize APK Output
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/mega-smm-india.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/mega-smm-india-v1.0-build${{ github.run_number }}.apk
          ls -lh release-artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mega-smm-india-apk
          path: release-artifacts/mega-smm-india.apk
          retention-days: 30

      - name: Create GitHub Release & Upload APK
        if: (github.event_name == 'workflow_dispatch' && (inputs.create_release == true || inputs.create_release == 'true')) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "MEGA SMM INDIA v1.0 (Build #${{ github.run_number }})"
          body: |
            ### 🚀 MEGA SMM INDIA - Android APK Release

            **Download the APK directly:**
            Download `mega-smm-india.apk` below and install it directly on your Android phone!

            #### ✨ Features:
            - **All SMM Services**: Instagram (Followers, Likes, Views), YouTube (Watchtime, Subs), Telegram, Facebook & Twitter.
            - **Google Sign-In & 1-Tap Admin Access**: Instant entry for `hafizur200511@gmail.com`.
            - **Live Firebase Firestore Backend**: Real-time balance updates, orders, services, and live support chat.
            - **Dynamic UPI QR Code Generator**: Seamless automatic QR for instant balance deposits.
            - **iOS 26 Liquid Glass UI**: Ultra-premium fluid animations, chromatic caustics, and glow badges.
            - **Commit**: `${{ github.sha }}`
          files: |
            release-artifacts/mega-smm-india.apk
            release-artifacts/mega-smm-india-v1.0-build${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
